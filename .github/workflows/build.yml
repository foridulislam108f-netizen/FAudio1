name: Build FAudio Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # If you upload the project as a zip, it is unzipped automatically.
      # If you upload the files directly, it builds them as they are.
      - name: Find project
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            rm -rf _proj && mkdir _proj && unzip -q "$ZIP" -d _proj
            SETTINGS=$(find _proj -name settings.gradle | head -n1)
          else
            SETTINGS=$(find . -maxdepth 3 -name settings.gradle -not -path './_proj/*' | head -n1)
          fi
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/FAudioPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FAudioPlayer-apk
          path: out/FAudioPlayer.apk
